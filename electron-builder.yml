appId: com.plkit.gateway
productName: PLKIT Gateway
directories:
  output: dist
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: PLKIT-Gateway-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
